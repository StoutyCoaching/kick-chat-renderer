# Builds KickChatRenderer.exe on GitHub's Windows runners.
#  - Run manually (Actions -> Build exe -> Run workflow): uploads the exe as a downloadable artifact.
#  - Push a tag like v1.0.0: also publishes the exe as a GitHub Release.
name: Build exe
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install pillow pyinstaller
      - name: Get ffmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name KickChatRenderer --add-binary "ffmpeg.exe;." kick_chat_render.py
      - uses: actions/upload-artifact@v4
        with: { name: KickChatRenderer, path: dist/KickChatRenderer.exe }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/KickChatRenderer.exe --title "${{ github.ref_name }}" --generate-notes
